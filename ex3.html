        .menu{background-color: azure; padding: 20px;/* 박스 안쪽여백 */ text-align: center;/* 메뉴 박스에 대하여 */}
        .menu a{
            color: #333333;/* 링크한 문자에 컬러 변경하기 */ text-decoration: none;/* 링크한 문자에 밑줄없애기 */

        .content img{width: 100%; }
        .button{
            display: inline-block;/* 문자외형을 박스로 인식하기 */

            color: white;/* 박스 안 문자는 흰색 */
            padding: 12px 30px;/* 박스 안에 여백을 넣어 문자가 여유있게 보이도록 설정 */
            text-decoration: none;/* 링크상 생기는 밑줄 없애기 */}
        .button:hover{background-color: orange;/* 마우스를 hover하면 주황색이 되도록 */}    
        .footer{background-color: rgb(255, 255, 255); color: #4ba3eb; padding: 20px; text-align: center;}

</head>
